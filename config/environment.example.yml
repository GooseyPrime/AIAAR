# Environment Configuration Example
#
# Copy this file to config/environment.yml for local, non-secret overrides.
# Keep API keys, auth tokens, and passwords in .env whenever possible.
# config/environment.yml is gitignored, but it is still safer to keep secrets in .env.
#
# Example secret locations:
#   EBAY_CLIENT_ID=...
#   EBAY_CLIENT_SECRET=...
#   EBAY_AUTH_TOKEN=...
#   OPENAI_API_KEY=...
#   AIRTABLE_API_KEY=...
#   AIRTABLE_BASE_ID=...
#   PAYPAL_CLIENT_ID=...
#   PAYPAL_CLIENT_SECRET=...
#   SHIPSTATION_API_KEY=...
#   SHIPSTATION_API_SECRET=...
#   EMAIL_PASSWORD=...

# eBay Configuration
ebay:
  marketplace_id: "EBAY_US"
  sandbox_mode: true  # Set to false for production

# OpenAI Configuration
openai:
  model: "gpt-4"
  temperature: 0.3
  max_tokens: 500

# Airtable Configuration
airtable:
  table_name: "Target Items"
  
# PayPal Configuration
paypal:
  sandbox_mode: true  # Set to false for production

# ShipStation Configuration
shipstation:
  default_carrier: "USPS"

# Email Configuration
email:
  provider: "gmail"  # gmail, outlook, etc.
  username: "your-email@domain.com"
  
# Make.com Configuration
make:
  webhook_base_url: "https://hook.make.com"
  team_id: "YOUR_TEAM_ID"

# Safety Settings
safety:
  daily_spending_limit: 200
  max_bid_per_item: 100
  min_seller_feedback: 95
  restricted_categories:
    - "Automotive parts"
    - "Health products"
    - "Adult items"

# Bidding Strategy
bidding:
  conservative_multiplier: 0.6
  aggressive_multiplier: 0.9
  safety_margin: 0.75
  min_profit_margin: 0.25